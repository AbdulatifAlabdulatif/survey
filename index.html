<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>دراسة عن استخدام الخدمات الرقمية</title>
<style>
  :root {
    --page: #eef2f0; --sheet: #ffffff; --ink: #17211e; --muted: #56635e;
    --rule: #d6dedb; --green: #0e5c4a; --green-tint: #e4efeb; --green-ink: #ffffff;
    --dialog: #f4f6fa; --dialog-edge: #c7cfdd; --error: #b3261e;
    --font: "SF Arabic", "Geeza Pro", "Segoe UI", "Noto Sans Arabic", "Noto Naskh Arabic", Tahoma, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --page: #101614; --sheet: #18201d; --ink: #e6ece9; --muted: #a2b0aa;
            --rule: #2e3a36; --green: #5cc0a2; --green-tint: #1c302a; --green-ink: #0b1411;
            --dialog: #1f2630; --dialog-edge: #3a4658; --error: #f2857c; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { max-width: 100%; overflow-x: hidden; }
  p, label, li, h1, h2 { overflow-wrap: anywhere; }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font);
         font-size: 17px; line-height: 1.75; }
  .top { position: sticky; top: 0; z-index: 5; background: var(--page); border-bottom: 1px solid var(--rule); }
  .top-inner { max-width: 760px; margin: 0 auto; padding: 10px 16px 8px; display: flex; gap: 12px;
               align-items: baseline; justify-content: space-between; }
  .brand { font-size: .95rem; font-weight: 600; color: var(--green); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step { font-size: .88rem; color: var(--muted); white-space: nowrap; }
  .track { height: 3px; background: var(--rule); }
  .track > div { height: 100%; width: 0; background: var(--green); transition: width .25s ease; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; }
  .sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: 24px 20px; }
  .sheet + .sheet { margin-top: 16px; }
  h1 { font-size: 1.6rem; line-height: 1.45; margin: 0 0 14px; font-weight: 700; }
  h2 { font-size: 1.3rem; line-height: 1.5; margin: 0 0 4px; font-weight: 700; }
  .desc { color: var(--muted); margin: 0 0 8px; }
  ul.info { padding-inline-start: 20px; margin: 10px 0 14px; }
  ul.info li { margin-bottom: 4px; }
  .q { padding: 20px 0; border-top: 1px solid var(--rule); }
  .q:first-of-type { border-top: 0; padding-top: 12px; }
  .qtext { margin: 0 0 12px; font-weight: 600; }
  .q.missing .qtext { color: var(--error); }
  .q.missing .qtext::before { content: "● "; }
  .opts { display: grid; gap: 8px; grid-template-columns: 1fr; }
  .opts label { display: flex; align-items: center; gap: 10px; border: 1px solid var(--rule); border-radius: 10px;
                padding: 10px 14px; cursor: pointer; min-height: 48px; background: var(--sheet); line-height: 1.4; }
  @media (hover: hover) { .opts label:hover { border-color: var(--green); } }
  .opts label:has(input:checked) { border-color: var(--green); background: var(--green-tint); font-weight: 600; }
  .opts input { accent-color: var(--green); width: 20px; height: 20px; margin: 0; flex: none; }
  .opts label:has(input:focus-visible) { outline: 3px solid var(--green); outline-offset: 2px; }
  @media (min-width: 760px) and (pointer: fine) {
    .opts.row { grid-auto-flow: column; grid-auto-columns: 1fr; grid-template-columns: none; }
    .opts.row label { flex-direction: column; justify-content: flex-start; text-align: center; gap: 6px;
                      padding: 12px 6px 10px; font-size: .92rem; min-height: 84px; }
    .opts.short { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  }
  .opts.short:not(.row) { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
  .scenario-context { margin: 0 0 10px; }
  .dialog { background: var(--dialog); border: 1px solid var(--dialog-edge); border-radius: 16px;
            padding: 14px 16px; margin: 0 0 12px; max-width: 440px; box-shadow: 0 6px 18px -12px rgba(20, 40, 60, .45); }
  .dialog p { margin: 0; font-size: 1.02rem; line-height: 1.7; }
  .scenario-note { margin: 0 0 10px; color: var(--muted); }
  select { width: 100%; font: inherit; padding: 12px; border-radius: 10px; border: 1px solid var(--rule);
           background: var(--sheet); color: var(--ink); min-height: 48px; }
  select:focus-visible, button:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
  .nav { display: flex; gap: 10px; justify-content: space-between; align-items: center; margin-top: 18px;
         padding-top: 16px; border-top: 1px solid var(--rule); }
  button { font: inherit; font-weight: 600; border-radius: 10px; padding: 12px 26px; cursor: pointer; min-height: 48px; }
  .primary { background: var(--green); color: var(--green-ink); border: 1px solid var(--green); }
  .secondary { background: transparent; color: var(--ink); border: 1px solid var(--rule); }
  button:disabled { opacity: .55; cursor: default; }
  .err { color: var(--error); margin: 12px 0 0; }
  .err:empty { display: none; }
  .center { text-align: center; }
  .contact { color: var(--muted); font-size: .95rem; margin: 0; }
  @media (max-height: 500px) { .top { position: static; } }
  @media (max-width: 759px), (pointer: coarse) {
    body { font-size: 16px; line-height: 1.7; background: var(--sheet); }
    .top { background: var(--sheet); }
    .top-inner { padding: 8px 16px 6px; }
    .brand { display: none; }
    .step { margin-inline-start: auto; }
    main { padding: 4px 16px 28px; }
    .sheet { border: 0; border-radius: 0; padding: 12px 0 0; background: transparent; }
    .sheet + .sheet { margin-top: 8px; border-top: 1px solid var(--rule); padding-top: 20px; }
    h1 { font-size: 1.3rem; }
    h2 { font-size: 1.15rem; }
    .q { padding: 16px 0; }
    .opts label { padding: 10px 12px; min-height: 46px; }
    .dialog { max-width: none; padding: 12px 14px; }
    .nav { position: sticky; bottom: 0; background: var(--sheet); margin: 14px -16px 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .nav button { flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) { .track > div { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <span class="brand">دراسة عن الخدمات الرقمية والبيانات الشخصية</span>
    <span class="step" id="step"></span>
  </div>
  <div class="track" aria-hidden="true"><div id="bar"></div></div>
</header>
<main>
  <div id="app"></div>
  <noscript><div class="sheet">يتطلب هذا الاستبيان تفعيل JavaScript في المتصفح.</div></noscript>
</main>

<script>
/* ================= إعدادات يعدّلها الباحث ================= */
const CONFIG = {
  ENDPOINT: "https://script.google.com/macros/s/AKfycbyGitJqMs1SCzuOgYJruwO75luaHKXWhmUeCh9IGAXciwgfToPHXuRu8qL2w3KLIlyWlw/exec",   // رابط Web app من Google Apps Script
  RESEARCHER: "د. عبداللطيف بن عبدالرحمن العبداللطيف، جامعة القصيم",
  EMAIL: "ab.alabdulatif@qu.edu.sa",
  VERSION: "1.0"
};
/* ========================================================== */

const AG5 = ["لا أوافق بشدة","لا أوافق","محايد","أوافق","أوافق بشدة"];
const AG7 = ["لا أوافق بشدة","لا أوافق","لا أوافق إلى حد ما","محايد","أوافق إلى حد ما","أوافق","أوافق بشدة"];
const SC  = ["سأوافق بالتأكيد","سأوافق على الأرجح","لست متأكداً","سأرفض على الأرجح","سأرفض بالتأكيد"];
const FR  = ["أبداً","نادراً","أحياناً","غالباً","دائماً"];
const TF  = [["T","صحيحة"],["F","خاطئة"],["DK","لا أعرف"]];
const num = labels => labels.map((l,i) => [String(i+1), l]);

/* Each page: {title, desc, items:[{id, text, opts:[[value,label]], type:'radio'|'select', vertical}]} */
const scenarios = [
  {id:"S_M", scenario:true, text:"تسجّل في تطبيق جديد لتوصيل الطعام لتطلب وجبة. قبل إكمال التسجيل تظهر رسالة: «هل توافق على استخدام رقم جوالك وبريدك الإلكتروني لإرسال عروض ترويجية تناسبك؟» رفضك لا يؤثر على طلبك. ما مدى احتمال رفضك؟", opts:num(SC), row:true},
  {id:"S_H", scenario:true, text:"تحجز موعداً عند طبيب عبر تطبيق. قبل تأكيد الحجز تظهر رسالة: «هل تسمح للتطبيق بالاطلاع على قائمة أمراضك المزمنة وأدويتك لتقديم توصيات صحية تناسبك؟» الحجز لا يحتاج هذه البيانات، ورفضك لا يؤثر عليه. ما مدى احتمال رفضك؟", opts:num(SC), row:true},
  {id:"S_E", scenario:true, text:"تُكمل عملية شراء من متجر إلكتروني. عند صفحة الدفع تظهر رسالة: «هل تسمح للمتجر بحفظ سجل تصفحك ومشترياتك لعرض منتجات تناسبك؟» رفضك لا يؤثر على عملية الشراء. ما مدى احتمال رفضك؟", opts:num(SC), row:true}
];
// Random scenario order per participant (Fisher–Yates), recorded in the data.
for (let i = scenarios.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [scenarios[i], scenarios[j]] = [scenarios[j], scenarios[i]];
}
const SCEN_ORDER = scenarios.map(s => s.id.slice(2)).join("-");

const PAGES = [
  {title:"معلومات عامة", items:[
    {id:"D1", text:"الفئة العمرية", opts:[["1","18–24"],["2","25–34"],["3","35–44"],["4","45 فأكثر"]]},
    {id:"D2", text:"الجنس", opts:[["1","ذكر"],["2","أنثى"],["9","أفضّل عدم الإجابة"]]},
    {id:"D3", text:"أعلى مؤهل تعليمي", opts:[["1","ثانوي فأقل"],["2","دبلوم"],["3","بكالوريوس"],["4","دراسات عليا"]]},
    {id:"D4", text:"منطقة الإقامة", type:"select", opts:[["1","الرياض"],["2","مكة المكرمة"],["3","المدينة المنورة"],["4","القصيم"],["5","المنطقة الشرقية"],["6","عسير"],["7","تبوك"],["8","حائل"],["9","الحدود الشمالية"],["10","جازان"],["11","نجران"],["12","الباحة"],["13","الجوف"]]},
    {id:"D5", text:"متوسط استخدامك اليومي للإنترنت", opts:[["1","أقل من ساعتين"],["2","من 2 إلى 4 ساعات"],["3","من 4 إلى 6 ساعات"],["4","أكثر من 6 ساعات"]]}
  ]},
  {title:"استخدامك للخدمات الرقمية", desc:"إلى أي مدى توافق على كل عبارة من العبارات التالية؟", items:[
    {id:"B_M", text:"عندما يطلب تطبيق أو متجر رقمي إذناً لإرسال عروض ترويجية، أرفض عادةً.", opts:num(AG5), row:true},
    {id:"B_H", text:"قبل استخدام تطبيق صحي (مواعيد، لياقة، أدوية)، أراجع ما البيانات التي يطلبها وأرفض غير الضروري.", opts:num(AG5), row:true},
    {id:"B_E", text:"عند التسوق الإلكتروني، أتحقق من سياسة الخصوصية أو موثوقية المتجر قبل إدخال بياناتي.", opts:num(AG5), row:true}
  ]},
  {title:"مواقف افتراضية", desc:"تخيّل أنك في كل موقف من المواقف التالية، واختر ما ستفعله على الأرجح.", items: scenarios},
  {title:"آراؤك حول بياناتك", desc:"إلى أي مدى توافق على كل عبارة من العبارات التالية؟", items:[
    {id:"C_M1", text:"يقلقني استخدام جهات تجارية لرقم جوالي أو بريدي في التسويق دون إذن واضح مني.", opts:num(AG5), row:true},
    {id:"C_M2", text:"يقلقني أن تطلب التطبيقات بيانات تواصلي لأغراض تسويقية لا علاقة لها بالخدمة التي أستخدمها.", opts:num(AG5), row:true},
    {id:"C_H1", text:"يقلقني جمع التطبيقات لبيانات عن صحتي أكثر مما تحتاجه الخدمة فعلياً.", opts:num(AG5), row:true},
    {id:"C_H2", text:"يقلقني أن تُستخدم معلوماتي الصحية لأغراض غير تقديم الخدمة الطبية التي طلبتها.", opts:num(AG5), row:true},
    {id:"C_E1", text:"يقلقني أن تحتفظ المتاجر الإلكترونية بسجل تصفحي ومشترياتي لاستخدامه في عرض منتجات عليّ.", opts:num(AG5), row:true},
    {id:"C_E2", text:"يقلقني احتفاظ المتاجر الإلكترونية ببياناتي بعد انتهاء حاجتها إليها.", opts:num(AG5), row:true}
  ]},
  {title:"الخصوصية على الإنترنت", desc:"إلى أي مدى توافق على كل عبارة من العبارات التالية؟", items:[
    {id:"G1", text:"خصوصية المستهلك على الإنترنت هي في حقيقتها مسألة حق المستهلك في ممارسة التحكم والاستقلالية في القرارات المتعلقة بكيفية جمع معلوماته واستخدامها ومشاركتها.", opts:num(AG7), row:true},
    {id:"G2", text:"يقع تحكّم المستهلك في معلوماته الشخصية في صميم خصوصيته.", opts:num(AG7), row:true},
    {id:"G3", text:"ينبغي للشركات التي تطلب المعلومات عبر الإنترنت أن تُفصح عن طريقة جمع البيانات ومعالجتها واستخدامها.", opts:num(AG7), row:true},
    {id:"G4", text:"ينبغي أن تتضمن سياسة الخصوصية الجيدة للمستهلك على الإنترنت إفصاحاً واضحاً وبارزاً.", opts:num(AG7), row:true},
    {id:"AC1", text:"للتأكد من قراءتك للأسئلة، اختر «أوافق بشدة» في هذه العبارة.", opts:num(AG7), row:true},
    {id:"G5", text:"يضايقني عادةً أن تطلب مني الشركات عبر الإنترنت معلومات شخصية.", opts:num(AG7), row:true},
    {id:"G6", text:"عندما تطلب مني الشركات عبر الإنترنت معلومات شخصية، أفكر أحياناً مرتين قبل تقديمها.", opts:num(AG7), row:true},
    {id:"G7", text:"يضايقني أن أقدّم معلوماتي الشخصية لهذا العدد الكبير من الشركات عبر الإنترنت.", opts:num(AG7), row:true},
    {id:"G8", text:"يقلقني أن الشركات عبر الإنترنت تجمع عني معلومات شخصية أكثر من اللازم.", opts:num(AG7), row:true}
  ]},
  {title:"طلبات الموافقة", desc:"خلال الأشهر الستة الماضية، كم مرة واجهت ما يلي؟", items:[
    {id:"F_M", text:"تطلب مني التطبيقات أو المتاجر الموافقة على استقبال رسائل أو عروض ترويجية.", opts:num(FR), row:true},
    {id:"F_H", text:"تطلب مني التطبيقات الصحية أو تطبيقات المواعيد الطبية الموافقة على الوصول إلى بياناتي الصحية.", opts:num(FR), row:true},
    {id:"F_E", text:"تطلب مني المتاجر الإلكترونية الموافقة على حفظ بياناتي أو على ملفات تعريف الارتباط (الكوكيز).", opts:num(FR), row:true}
  ]},
  {title:"نظام حماية البيانات الشخصية", desc:"إلى أي مدى توافق على كل عبارة من العبارات التالية؟", items:[
    {id:"K1", text:"أعلم بوجود نظام سعودي لحماية البيانات الشخصية.", opts:num(AG5), row:true},
    {id:"K2", text:"أعرف الجهة الحكومية التي يمكنني تقديم شكوى إليها إذا أُسيء استخدام بياناتي.", opts:num(AG5), row:true},
    {id:"K3", text:"أعرف حقوقي النظامية تجاه الجهات التي تجمع بياناتي الشخصية.", opts:num(AG5), row:true}
  ]},
  {title:"ما تعرفه عن النظام", desc:"حدّد ما إذا كانت كل عبارة صحيحة أم خاطئة وفق نظام حماية البيانات الشخصية في المملكة. إذا لم تكن متأكداً، اختر «لا أعرف» ولا تخمّن.", items:[
    {id:"K4",  text:"يحق لي سحب موافقتي على معالجة بياناتي في أي وقت.", opts:TF, row:true},
    {id:"K5",  text:"يجوز للجهة الاحتفاظ ببياناتي الشخصية بعد انتهاء الغرض من جمعها دون أي قيد.", opts:TF, row:true},
    {id:"K6",  text:"يحق لي أن أطلب من الجهة نسخة من بياناتي الشخصية التي تحتفظ بها.", opts:TF, row:true},
    {id:"K7",  text:"يحق للشركات نقل بياناتي إلى خارج المملكة بحرية دون أي شروط.", opts:TF, row:true},
    {id:"K8",  text:"يجب أن تُبلغني الجهة بالغرض من جمع بياناتي عند جمعها أو قبله.", opts:TF, row:true},
    {id:"K9",  text:"يجوز استخدام بياناتي الصحية لأغراض تسويقية إذا وافقت على ذلك.", opts:TF, row:true},
    {id:"K10", text:"يمكنني تقديم شكوى إلى الجهة المختصة إذا خالفت جهةٌ النظام في التعامل مع بياناتي.", opts:TF, row:true},
    {id:"K11", text:"يكفي أن تعالج الجهة تسرّب بياناتي داخلياً دون إبلاغ الجهة المختصة.", opts:TF, row:true}
  ]}
];

const answers = {};
let page = -1;           // -1 = welcome/consent
const startedAt = Date.now();
const app = document.getElementById("app");
const bar = document.getElementById("bar");
const stepEl = document.getElementById("step");

function el(tag, attrs = {}, text) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
}

function alreadySubmitted() {
  try { return localStorage.getItem("pp_survey_done") === "1"; } catch (e) { return false; }
}

function renderWelcome() {
  bar.style.width = "0%";
  stepEl.textContent = "";
  app.replaceChildren();
  const c = el("div", {class:"sheet"});
  c.append(el("h1", {}, "دراسة عن استخدام الخدمات الرقمية والتعامل مع البيانات الشخصية"));
  c.append(el("p", {}, "مرحباً بك، وشكراً لاهتمامك بالمشاركة."));
  c.append(el("p", {}, "تهدف هذه الدراسة إلى فهم العلاقة بين قلق الأفراد على خصوصية البيانات الشخصية في الخدمات الرقمية، والسلوك في حمايتها، ومدى المعرفة بنظام حماية البيانات الشخصية في المملكة العربية السعودية. يجري الدراسة " + CONFIG.RESEARCHER + "."));
  const ul = el("ul", {class:"info"});
  [
    "المشاركة طوعية، ويستغرق الاستبيان نحو 7–8 دقائق.",
    "لا يتم جمع أي بيانات شخصية.",
    "يمكنك التوقف في أي لحظة قبل الإرسال. بعد الإرسال لا يمكن حذف إجابتك لأنها لا ترتبط بك بأي شكل.",
    "تُستخدم البيانات التي تُجمع في هذا الاستبيان لأغراض البحث العلمي فقط، ولا تُستخدم لأي غرض آخر، وتُعرض نتائجها مجمّعة دون أي إشارة إلى المشاركين.",
    "لا توجد إجابات صحيحة أو خاطئة في الأسئلة عن رأيك وسلوكك؛ يُرجى الإجابة بما يعبّر عنك فعلاً."
  ].forEach(t => ul.append(el("li", {}, t)));
  c.append(ul);
  c.append(el("p", {class:"contact"}, "للاستفسار: " + CONFIG.EMAIL));
  app.append(c);

  const g = el("div", {class:"sheet"});
  g.append(el("h2", {}, "الموافقة على المشاركة"));
  g.append(question({id:"consent", text:"هل توافق على المشاركة في هذه الدراسة؟", opts:[["1","أوافق"],["0","لا أوافق"]]}));
  g.append(question({id:"age18", text:"هل عمرك 18 سنة فأكثر؟", opts:[["1","نعم"],["0","لا"]]}));
  const err = el("p", {class:"err", role:"alert"});
  g.append(err);
  const nav = el("div", {class:"nav"});
  const start = el("button", {class:"primary", type:"button"}, "ابدأ");
  start.addEventListener("click", () => {
    const missing = ["consent","age18"].filter(k => !answers[k]);
    markMissing(g, missing);
    if (missing.length) { err.textContent = "يُرجى الإجابة عن السؤالين للمتابعة."; return; }
    if (answers.consent !== "1" || answers.age18 !== "1") return renderEnd(false);
    page = 0; renderPage();
  });
  nav.append(el("span"), start);
  g.append(nav);
  app.append(g);
}

function question(q, onAnswer) {
  const box = el("div", {class:"q", "data-q":q.id});
  const lblId = "lbl_" + q.id;
  if (q.scenario) {
    const a = q.text.indexOf("«"), b = q.text.indexOf("»");
    const tail = q.text.slice(b + 1).trim();
    const lastStop = tail.lastIndexOf(".");
    box.append(el("p", {class:"scenario-context"}, q.text.slice(0, a).trim()));
    const d = el("div", {class:"dialog", role:"note"});
    d.append(el("p", {}, q.text.slice(a + 1, b).trim()));
    box.append(d);
    if (lastStop > -1) box.append(el("p", {class:"scenario-note"}, tail.slice(0, lastStop + 1).trim()));
    box.append(el("p", {class:"qtext", id:lblId}, lastStop > -1 ? tail.slice(lastStop + 1).trim() : tail));
  } else {
    box.append(el("p", {class:"qtext", id:lblId}, q.text));
  }
  const done = () => { box.classList.remove("missing"); if (onAnswer) onAnswer(); };
  if (q.type === "select") {
    const s = el("select", {"aria-labelledby":lblId});
    s.append(el("option", {value:""}, "اختر المنطقة"));
    q.opts.forEach(([v, t]) => s.append(el("option", {value:v}, t)));
    if (answers[q.id]) s.value = answers[q.id];
    s.addEventListener("change", () => { answers[q.id] = s.value || undefined; done(); });
    box.append(s);
  } else {
    const cls = "opts" + (q.row ? " row" : "") + (!q.row && !q.vertical && q.opts.length <= 4 ? " short" : "");
    const opts = el("div", {class:cls, role:"radiogroup", "aria-labelledby":lblId});
    q.opts.forEach(([v, t]) => {
      const lab = el("label");
      const inp = el("input", {type:"radio", name:q.id, value:v});
      if (answers[q.id] === v) inp.checked = true;
      inp.addEventListener("change", () => { answers[q.id] = v; done(); });
      lab.append(inp, el("span", {}, t));
      opts.append(lab);
    });
    box.append(opts);
  }
  return box;
}

function markMissing(container, ids) {
  container.querySelectorAll(".q").forEach(b => b.classList.toggle("missing", ids.includes(b.dataset.q)));
  if (ids.length) {
    const first = container.querySelector('.q[data-q="' + ids[0] + '"]');
    if (first) first.scrollIntoView({behavior:"smooth", block:"center"});
  }
}

function renderPage() {
  const p = PAGES[page];
  bar.style.width = Math.round((page / PAGES.length) * 100) + "%";
  stepEl.textContent = "القسم " + (page + 1) + " من " + PAGES.length;
  app.replaceChildren();
  const c = el("div", {class:"sheet"});
  c.append(el("h2", {}, p.title));
  if (p.desc) c.append(el("p", {class:"desc"}, p.desc));
  const err = el("p", {class:"err", role:"alert"});
  const clearIfDone = () => { if (p.items.every(q => answers[q.id])) err.textContent = ""; };
  p.items.forEach(q => c.append(question(q, clearIfDone)));
  c.append(err);
  const nav = el("div", {class:"nav"});
  const back = el("button", {class:"secondary", type:"button"}, "السابق");
  back.addEventListener("click", () => { page -= 1; page < 0 ? renderWelcome() : renderPage(); window.scrollTo(0, 0); });
  const last = page === PAGES.length - 1;
  const next = el("button", {class:"primary", type:"button"}, last ? "إرسال" : "التالي");
  next.addEventListener("click", () => {
    const missing = p.items.map(q => q.id).filter(id => !answers[id]);
    markMissing(c, missing);
    if (missing.length) { err.textContent = "يُرجى الإجابة عن جميع الأسئلة في هذه الصفحة."; return; }
    err.textContent = "";
    if (last) return submit(next, err);
    page += 1; renderPage(); window.scrollTo(0, 0);
  });
  nav.append(back, next);
  c.append(nav);
  app.append(c);
}

function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  return Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
}

async function submit(btn, err) {
  btn.disabled = true; btn.textContent = "جارٍ الإرسال…";
  const payload = Object.assign({
    response_id: uuid(),
    version: CONFIG.VERSION,
    duration_sec: Math.round((Date.now() - startedAt) / 1000),
    scenario_order: SCEN_ORDER
  }, answers);
  const body = JSON.stringify(payload);
  let ok = false;
  try {
    const r = await fetch(CONFIG.ENDPOINT, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body, redirect:"follow"});
    const j = await r.json();
    ok = !!(j && j.ok);
  } catch (e) {
    // Some browsers block reading the reply; send again without reading it.
    // The server ignores a repeated response_id, so this cannot create a duplicate row.
    try {
      await fetch(CONFIG.ENDPOINT, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body});
      ok = true;
    } catch (e2) { ok = false; }
  }
  if (ok) {
    try { localStorage.setItem("pp_survey_done", "1"); } catch (e) {}
    renderEnd(true);
  } else {
    btn.disabled = false; btn.textContent = "إرسال";
    err.textContent = "تعذّر الإرسال. تحقّق من اتصالك بالإنترنت ثم اضغط «إرسال» مرة أخرى.";
  }
}

function renderEnd(completed) {
  bar.style.width = completed ? "100%" : "0%";
  stepEl.textContent = "";
  app.replaceChildren();
  const c = el("div", {class:"sheet center"});
  if (completed) {
    c.append(el("h2", {}, "شكراً لمشاركتك"));
    c.append(el("p", {}, "لا تتضمن إجابتك أي بيانات شخصية. لمعرفة المزيد عن حقوقك في حماية بياناتك الشخصية، يمكنك الرجوع إلى موقع الهيئة السعودية للبيانات والذكاء الاصطناعي (سدايا)."));
  } else {
    c.append(el("h2", {}, "شكراً لوقتك"));
    c.append(el("p", {}, "هذه الدراسة مخصّصة للبالغين (18 سنة فأكثر) الموافقين على المشاركة. لم تُسجَّل أي إجابة."));
  }
  app.append(c);
  window.scrollTo(0, 0);
}

if (alreadySubmitted()) {
  app.replaceChildren();
  const c = el("div", {class:"sheet center"});
  c.append(el("h2", {}, "تم استلام مشاركتك"));
  c.append(el("p", {}, "شكراً لك. سُجّلت مشاركة سابقة من هذا المتصفح."));
  app.append(c);
} else {
  renderWelcome();
}
</script>
